name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          {
            printf "## Installation\n\n"
            printf "1. Download **ai-rewriter-%s.zip** below\n" "$TAG"
            printf "2. Unzip it anywhere permanent (e.g. \`~/Extensions/ai-rewriter\`)\n"
            printf "3. Open Chrome → \`chrome://extensions\` → enable **Developer mode** (top-right)\n"
            printf "4. Click **Load unpacked** → select the unzipped folder\n"
            printf "5. Open the extension options → paste your [OpenRouter API key](https://openrouter.ai/settings/keys)\n\n"
            printf "> Do not delete the folder after loading — Chrome loads the extension live from it.\n\n"
            printf "---\n\n"
            echo "$NOTES"
          } > /tmp/release_notes.md

      - name: Build zip
        run: |
          zip -r ai-rewriter-${{ github.ref_name }}.zip \
            manifest.json \
            background.js \
            content.js \
            content.css \
            popup.html \
            popup.css \
            popup.js \
            options.html \
            options.css \
            options.js \
            spicychat-rpg-tracker-sections.js \
            icons/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: AI Rewriter ${{ github.ref_name }}
          body_path: /tmp/release_notes.md
          files: ai-rewriter-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
