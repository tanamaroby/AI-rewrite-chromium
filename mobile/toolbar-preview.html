<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Rewriter - Mobile Toolbar Preview</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #0a0514;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #ai-mobile-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(8, 5, 20, 0.96);
    border-bottom: 1px solid rgba(139, 92, 246, 0.35);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
  }

  #ai-tb-row {
    display: grid;
    grid-template-columns: 1fr 1fr 42px;
    gap: 8px;
    align-items: center;
  }

  .ai-tb-action {
    height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.35);
    background: linear-gradient(145deg, rgba(30, 20, 60, 0.95), rgba(20, 14, 40, 0.95));
    color: #e9d5ff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .ai-tb-action:active {
    transform: scale(0.97);
    background: linear-gradient(145deg, rgba(109, 40, 217, 0.55), rgba(76, 29, 149, 0.75));
  }

  #ai-tb-format {
    border-color: rgba(52, 211, 153, 0.45);
    color: #6ee7b7;
    background: linear-gradient(145deg, rgba(16, 80, 60, 0.5), rgba(10, 30, 20, 0.9));
  }

  #ai-tb-format:active {
    background: linear-gradient(145deg, rgba(16, 185, 129, 0.45), rgba(6, 60, 40, 0.95));
  }

  #ai-tb-settings {
    height: 44px;
    width: 42px;
    border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.35);
    background: rgba(25, 17, 50, 0.9);
    color: #c4b5fd;
    font-size: 18px;
    cursor: pointer;
  }

  #ai-tb-status {
    min-height: 16px;
    font-size: 11px;
    color: rgba(224, 222, 255, 0.7);
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #ai-tb-status.working { color: #a78bfa; }
  #ai-tb-status.error { color: #f87171; }
  #ai-tb-status.done { color: #6ee7b7; }

  #ai-settings-backdrop {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  #ai-settings-backdrop.open {
    opacity: 1;
    pointer-events: all;
  }

  #ai-settings-sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 201;
    transform: translateY(105%);
    transition: transform 0.25s ease;
    border-radius: 20px 20px 0 0;
    border-top: 1px solid rgba(139, 92, 246, 0.35);
    background: rgba(7, 4, 18, 0.99);
    padding: 16px;
  }

  #ai-settings-sheet.open {
    transform: translateY(0);
  }

  #ai-settings-title {
    margin: 0 0 10px;
    font-size: 18px;
    font-weight: 800;
    color: #e2e8f0;
  }

  .ai-stg-label {
    display: block;
    margin: 12px 0 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(139, 92, 246, 0.7);
  }

  .ai-stg-model {
    margin: 0;
    font-size: 13px;
    color: #c4b5fd;
  }

  #ai-stg-prompt {
    width: 100%;
    min-height: 130px;
    resize: none;
    box-sizing: border-box;
    border-radius: 12px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    background: rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
    font-size: 14px;
    line-height: 1.5;
    padding: 12px;
    font-family: inherit;
  }

  #ai-settings-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .ai-stg-btn {
    height: 40px;
    border-radius: 10px;
    border: 1px solid rgba(139, 92, 246, 0.35);
    background: rgba(139, 92, 246, 0.16);
    color: #c4b5fd;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .ai-stg-btn.green {
    border-color: rgba(52, 211, 153, 0.4);
    background: rgba(52, 211, 153, 0.12);
    color: #34d399;
  }

  #ai-settings-close {
    margin-top: 8px;
    width: 100%;
    height: 40px;
    border-radius: 10px;
    border: 1px solid rgba(139, 92, 246, 0.2);
    background: rgba(20, 14, 40, 0.7);
    color: #94a3b8;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .page-content {
    max-width: 700px;
    margin: 0 auto;
    padding: 94px 18px 40px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 22px;
    color: #c4b5fd;
  }

  .subtitle {
    margin: 0 0 20px;
    color: #94a3b8;
    font-size: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: rgba(139, 92, 246, 0.7);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #demo-textarea {
    width: 100%;
    min-height: 170px;
    border-radius: 14px;
    border: 1px solid rgba(139, 92, 246, 0.25);
    background: rgba(255, 255, 255, 0.04);
    color: #e2e8f0;
    font-size: 15px;
    line-height: 1.6;
    padding: 14px 16px;
    resize: vertical;
    font-family: inherit;
  }

  #page-status {
    margin-top: 10px;
    font-size: 13px;
    color: #94a3b8;
    font-style: italic;
  }
</style>
</head>
<body>

<div id="ai-mobile-toolbar">
  <div id="ai-tb-row">
    <button id="ai-tb-format" class="ai-tb-action">Format</button>
    <button id="ai-tb-rewrite" class="ai-tb-action">Rewrite</button>
    <button id="ai-tb-settings">&#9881;</button>
  </div>
  <div id="ai-tb-status">Ready</div>
</div>

<div id="ai-settings-backdrop"></div>
<div id="ai-settings-sheet">
  <h2 id="ai-settings-title">Rewrite Settings</h2>
  <span class="ai-stg-label">Model</span>
  <p class="ai-stg-model" id="ai-stg-model-text"></p>
  <span class="ai-stg-label">Rewrite Prompt</span>
  <textarea id="ai-stg-prompt"></textarea>
  <div id="ai-settings-actions">
    <button id="ai-stg-save" class="ai-stg-btn green">Save Prompt</button>
    <button id="ai-stg-reset" class="ai-stg-btn">Reset Default</button>
  </div>
  <button id="ai-settings-close">Close</button>
</div>

<div class="page-content">
  <h1>Mobile Toolbar Preview</h1>
  <p class="subtitle">Minimal mobile UI preview with one rewrite preset and one local formatter.</p>
  <label for="demo-textarea">Demo Text Area</label>
  <textarea id="demo-textarea">*This is a test sentence,* should be allowed and now having it changed to *This is a test sentence,.* (ignore capitalization for now)</textarea>
  <p id="page-status">Use Format to test local formatting. Rewrite is simulated in preview.</p>
</div>

<script>
(function () {
  "use strict";

  var MODEL = "google/gemini-3.1-flash-lite";
  var DEFAULT_REWRITE_PROMPT =
    "Rewrite text for clarity, flow, and word choice. Speech distortions apply only to spoken dialogue (in quotes). Don't add plot, characters, events, paragraphs, or sentences. Max 2 sentences per paragraph.";

  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
  function load(key, def) { try { var v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : def; } catch { return def; } }

  var rewritePrompt = load("preview_rewrite_prompt_v1", DEFAULT_REWRITE_PROMPT);

  var demoTextarea = document.getElementById("demo-textarea");
  var statusEl = document.getElementById("ai-tb-status");
  var pageStatus = document.getElementById("page-status");
  var stgBackdrop = document.getElementById("ai-settings-backdrop");
  var stgSheet = document.getElementById("ai-settings-sheet");
  var promptInput = document.getElementById("ai-stg-prompt");

  document.getElementById("ai-stg-model-text").textContent = MODEL;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || "";
  }

  function wrapOutside(str) {
    return str.replace(/[^\n]+/g, function(chunk) {
      var trimmed = chunk.trim();
      if (!trimmed) return chunk;
      var lead = chunk.slice(0, chunk.length - chunk.trimStart().length);
      var trail = chunk.slice(chunk.trimEnd().length);
      return lead + "*" + trimmed + "*" + trail;
    });
  }

  function formatText(text) {
    text = text.replace(/\(\(\s*([\s\S]*?)\s*\)\)/g, "($1)");
    text = text.replace(/\*/g, "");
    text = text.replace(/[\u201C\u201D]/g, '"');
    text = text.replace(/[\u2018\u2019]/g, "'");
    text = text.replace(/(?<!-)--(?!-)/g, "\u2014");
    text = text.replace(/ +([,!?:;])/g, "$1");
    text = text.replace(/ +(\.)(?!\d)/g, "$1");
    text = text.replace(/\.{2,}/g, "...");
    text = text.replace(/\.{3}/g, "\u2026");
    text = text.replace(/(?<=[^\d\s.!?,;:\u2026])\.(?=[A-Za-z])/g, ". ");
    text = text.replace(/([,!?:;])(?=[A-Za-z])/g, "$1 ");
    text = text.replace(/[ \t]{2,}/g, " ");
    text = text.replace(/\bi\b/g, "I");
    text = text.split("\n").map(function(l) { return l.trim(); }).join("\n");
    text = text.replace(/\n+/g, "\n\n");
    text = text.replace(/(^|\n\n)([a-z])/g, function(_, sep, ch) { return sep + ch.toUpperCase(); });
    text = text.replace(/([^.\u2026])([.!?]) +([a-z])/g, function(_, pre, punc, ch) { return pre + punc + " " + ch.toUpperCase(); });
    text = text.replace(/"([a-z])/g, function(_, ch) { return '"' + ch.toUpperCase(); });

    var parts = [];
    var regex = /"[^"]*"|\[[^\]]*\]/g;
    var lastIndex = 0;
    var m;

    while ((m = regex.exec(text)) !== null) {
      if (m.index > lastIndex) parts.push(wrapOutside(text.slice(lastIndex, m.index)));
      parts.push(m[0]);
      lastIndex = regex.lastIndex;
    }

    if (lastIndex < text.length) parts.push(wrapOutside(text.slice(lastIndex)));

    var result = parts.join("");
    result = result.replace(/\*([^*\n]+)\*/g, function(_, inner) {
      var t = inner.trimEnd();
      return /[.!?,;:\u2026\u2014\-_]$/.test(t) ? "*" + inner + "*" : "*" + t + ".*";
    });
    result = result.replace(/([.!?\u2026\u2014\-_]\*)([^*]*)\*([a-z])/g, function(_, end, mid, ch) {
      return end + mid + "*" + ch.toUpperCase();
    });

    return result;
  }

  function openSettings() {
    promptInput.value = rewritePrompt;
    stgBackdrop.classList.add("open");
    stgSheet.classList.add("open");
  }

  function closeSettings() {
    stgBackdrop.classList.remove("open");
    stgSheet.classList.remove("open");
  }

  document.getElementById("ai-tb-format").addEventListener("click", function() {
    var text = demoTextarea.value.trim();
    if (!text) {
      setStatus("Nothing to format", "error");
      return;
    }
    demoTextarea.value = formatText(text);
    setStatus("Formatted", "done");
    pageStatus.textContent = "Formatted locally. Comma/colon ending in wrapped text is preserved.";
  });

  document.getElementById("ai-tb-rewrite").addEventListener("click", function() {
    var text = demoTextarea.value.trim();
    if (!text) {
      setStatus("Nothing to rewrite", "error");
      return;
    }
    setStatus("Rewriting (preview)...", "working");
    pageStatus.textContent = "Preview mode: this simulates AI rewrite then local format.";
    setTimeout(function() {
      demoTextarea.value = formatText(text);
      setStatus("Done", "done");
    }, 500);
  });

  document.getElementById("ai-tb-settings").addEventListener("click", openSettings);
  document.getElementById("ai-settings-close").addEventListener("click", closeSettings);
  stgBackdrop.addEventListener("click", closeSettings);

  document.getElementById("ai-stg-save").addEventListener("click", function() {
    var value = promptInput.value.trim();
    rewritePrompt = value || DEFAULT_REWRITE_PROMPT;
    save("preview_rewrite_prompt_v1", rewritePrompt);
    setStatus("Prompt saved", "done");
    closeSettings();
  });

  document.getElementById("ai-stg-reset").addEventListener("click", function() {
    rewritePrompt = DEFAULT_REWRITE_PROMPT;
    promptInput.value = DEFAULT_REWRITE_PROMPT;
    save("preview_rewrite_prompt_v1", rewritePrompt);
    setStatus("Prompt reset", "done");
  });
})();
</script>

</body>
</html>
